name: Support question
description: Ask for help with setup or behavior in the current development version.
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: |
        Please check README.md, plugin/README.md, docs/war-thunder-plugin-architecture.md, and docs/streamdock-input-lessons.md first.

        For security issues, do not use this form. Follow SECURITY.md instead.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, Stream Dock version, War Thunder status, WTDeck commit
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
    validations:
      required: true
  - type: textarea
    id: what_you_tried
    attributes:
      label: What have you already tried?
  - type: textarea
    id: context
    attributes:
      label: Logs, screenshots, or extra context
