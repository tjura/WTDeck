<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="barGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="144" height="144" fill="#000000"/>
  <g filter="url(#textGlow)">
    <text x="72" y="62" fill="#F0F0F0" font-size="22" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle" opacity="0.3">LANDING</text>
    <text x="72" y="92" fill="#F0F0F0" font-size="22" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle" opacity="0.3">GEAR</text>
  </g>
  <g filter="url(#barGlow)">
    <rect x="28" y="116" width="88" height="8" rx="2" fill="#3A3A3A" opacity="0.4"/>
  </g>
</svg>
